              ? S2(rows, "missed") : null },
          { label: "RNA (rang out)", type: "int", w: 15, val: r => r.rna,
            tot: rows => rows.some(r => r.rna != null)
              ? S2(rows, "rna") : null }] }] : []),
      { label: "Available", key: "rdP",
        fmt: (v, r) => v == null ? "—" : `${fmtHrs(r.rd)} (${v}%)`,
        total: rows => S2(rows, "lg")
          ? `${fmtHrs(S2(rows, "rd"))} (${pct(S2(rows, "rd"), S2(rows, "lg"))})`
          : "—",
        xl: [{ label: "Available (Ready)", type: "dur", w: 17, val: r => r.rd,
            tot: rows => S2(rows, "rd") },
          { label: "Available % of Staffed", type: "pct", w: 20, val: r => r.rdP,
            tot: rows => S2(rows, "lg")
              ? 100 * S2(rows, "rd") / S2(rows, "lg") : null }] },
      { label: "Occ", key: "occ", fmt: v => v == null ? "—" : v + "%",
        total: rows => pct(S2(rows, "tk") + S2(rows, "aw"), S2(rows, "lg")),
        xl: { label: "Occupancy", type: "pct", val: r => r.occ,
          tot: rows => S2(rows, "lg")
            ? 100 * (S2(rows, "tk") + S2(rows, "aw")) / S2(rows, "lg") : null } },
      { label: "Not Ready", key: "nrP", fmt: v => v == null ? "—" : v + "%",
        total: rows => pct(S2(rows, "nr"), S2(rows, "lg")),
        xl: [{ label: "Not Ready", type: "dur", val: r => r.nr,
            tot: rows => S2(rows, "nr") },
          { label: "Not Ready % of Staffed", type: "pct", w: 20, val: r => r.nrP,
            tot: rows => S2(rows, "lg")
              ? 100 * S2(rows, "nr") / S2(rows, "lg") : null }] },
      /* the status dot is a rendered element, not data — leave it out */
      { label: "", key: "_dot", nosort: true, xl: null, fmt: (v, r) => {
        const bad = Math.max(r.nrP >= 30 || r.ubP >= THRESHOLDS.ubCritPct ? 2 : 0,
          r.nrP >= 20 || r.ubP >= THRESHOLDS.ubWarnPct ? 1 : 0);
        const s = document.createElement("span");
        s.className = "stdot " + (bad === 2 ? "crit" : bad === 1 ? "warn" : "ok");
        return s;
      } },
    ];
    const api2 = sortTable(ab2, cols2, rows2, { defaultKey: "occ" });
    searchBox(ah2, api2);
    exportButton(ah2, "Export to Excel", () => exportPanelXlsx({
      file: `Five9 Agent Time - ${rangeOf().label} - `
        + new Date().toISOString().slice(0, 10),
      sheet: "Agent Time & Occupancy", cols: cols2, rows: api2.visible(),
      details: exportDetails("Agent Time & Occupancy", api2.visible().length,
        api2.queryText(), "Every column here comes from the Five9 agent state "
        + "feed, which carries no campaign, skill or disposition — this panel "
        + "is scoped by date, department and agent only."),
    }));
  }

  /* footnote */
  const fn = document.getElementById("footnote");
  fn.textContent = "";
  fn.appendChild(icon("info", "currentColor", 14));
  fn.append(LIVE
    ? `Five9 Reporting API → pull_data.py → data.js · ${fmt(CALLS.length)} calls held ` +
      `(last ${D.days_kept || 30} days) · timestamps in company time (ET) · ` +
      `service level target ${THRESHOLDS.slTargetSec}s · agent filter scopes agent panels ` +
      `and dispositions only`
    : "SAMPLE DATA — run pull_data.py with Five9 credentials in config.json to go live. " +
      "Layout, filters, alerts and insights all work against this generated preview.");
}

/* ============================================================
   CLEARVIEW EMBED — rendered once, outside the re-rendered #app,
   so changing a filter never reloads the iframe. Starts closed on
   every fresh open; "Show dashboard" loads it, and the open state
   sticks only for the tab session (survives the auto-reload).
   ============================================================ */
function renderClearView() {
  const host = document.getElementById("clearview");
  if (!host || !CLEARVIEW_URL) return;
  const card = h("div", "card", host);
  card.id = "sec-clearview";
  const ch = h("div", "chead", card);
  h("h2", null, ch, "Five9 ClearView");
  infoIcon(ch, "Five9 ClearView");
  h("span", "cap", ch, "live shared dashboard, embedded from Five9");
  const open = h("a", "cvlink", ch, "Open in new tab ↗");
  open.href = CLEARVIEW_URL;
  open.target = "_blank";
  open.rel = "noopener noreferrer";
  open.style.marginLeft = "auto";
  const toggle = h("button", "cvbtn", ch);
  const reload = h("button", "cvbtn", ch, "Reload");
  reload.style.display = "none";
  const body = h("div", "cvbody", card);

  let frame = null;
  const show = (on, save = true) => {
    toggle.textContent = on ? "Hide" : "Show dashboard";
    reload.style.display = on ? "" : "none";
    body.textContent = "";
    if (!on) {
      frame = null;
      const idle = h("div", "cvidle", body);
      idle.append("The ClearView dashboard is hidden.");
      idle.appendChild(document.createElement("br"));
      const s = h("span", null, idle,
        "It loads only when shown, so it doesn't slow this page down.");
      s.style.fontSize = "11.5px";
    } else {
      frame = document.createElement("iframe");
      frame.className = "cvframe";
      frame.src = CLEARVIEW_URL;
      frame.height = CLEARVIEW_HEIGHT;
      /* no loading="lazy": the Show toggle already gates loading, and lazy
         would leave the frame blank until scrolled into view */
      frame.referrerPolicy = "no-referrer-when-downgrade";
      frame.title = "Five9 ClearView dashboard";
      body.appendChild(frame);
      /* if Five9 ever starts refusing to be framed, the iframe stays blank —
         say so instead of leaving an empty white box */
      setTimeout(() => {
        if (!frame || !frame.isConnected) return;
        let blocked = false;
        try {
          const d = frame.contentDocument;
          blocked = d && d.body && d.body.childElementCount === 0;
        } catch (e) { blocked = false; }   // cross-origin = it loaded fine
        if (blocked) {
          const w = h("div", "cvidle", body);
          w.style.color = "var(--warn)";
          w.textContent = "ClearView did not render here — Five9 may now be "
            + "blocking embedding. Use “Open in new tab” above.";
        }
      }, 6000);
    }
    /* sessionStorage, not localStorage: a fresh open of the page always
       starts closed, but the 5-min auto-reload keeps it open mid-viewing */
    if (save) try { sessionStorage.setItem("five9-cv", on ? "1" : "0"); } catch (e) {}
  };
  toggle.addEventListener("click", () => show(!frame));
  reload.addEventListener("click", () => { if (frame) frame.src = frame.src; });
  let start = "0";
  try { start = sessionStorage.getItem("five9-cv") || "0"; } catch (e) {}
  show(start === "1", false);
}

/* ============================================================
   BOOT
   ============================================================ */
renderNav();
render();
renderClearView();
scrollSpy();
/* drop a shadow under the pinned filter bar once the page scrolls */
window.addEventListener("scroll", () => {
  document.getElementById("filterbar").classList.toggle("scrolled", scrollY > 8);
}, { passive: true });
window.__booted = true;
/* auto-reload every 5 min to pick up fresh data.js */
setTimeout(() => location.reload(), 5 * 60000);
};  /* end __FIVE9_MAIN */

/* ============================================================
   UNLOCK GATE — data.js is encrypted at rest (window.F9_ENC,
   PBKDF2-SHA256 → AES-256-GCM over a zlib-compressed payload,
   written by email_sync.py). Ask for the passphrase once per
   browser session; cache the derived key in sessionStorage so
   the 5-min auto-reload stays silent. Plaintext window.F9
   (legacy) or no data at all (sample mode) boots without a
   prompt.
   ============================================================ */
(function () {
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  let theKey = null;   // retained after a successful decrypt (stale refresh)
  async function inflate(buf) {
    const ds = new DecompressionStream("deflate");   // zlib format
    return new Response(new Blob([buf]).stream().pipeThrough(ds)).arrayBuffer();
  }
  async function toPayload(pt, zip) {
    if (zip) pt = await inflate(pt);
    return JSON.parse(new TextDecoder().decode(pt));
  }
  /* Cache-busted refetch of data.js — GitHub Pages' CDN caches it for
     10 min, so a plain reload can keep serving the previous snapshot. */
  async function freshEnc() {
    try {
      const r = await fetch("data.js?fresh=" + Date.now(), { cache: "reload" });
      if (!r.ok) return null;
      const t = await r.text();
      const i = t.indexOf("{"), j = t.lastIndexOf("}");
      return (i >= 0 && j > i) ? JSON.parse(t.slice(i, j + 1)) : null;
    } catch (e) { return null; }
  }
  const boot = async () => {
    /* A tab can sit locked for hours, and the CDN can serve stale files:
       if what we decrypted is old, pull the latest ciphertext past the
       cache and decrypt it with the key we already have. pulled_at is ET
       wall time — viewers are ET, and for anyone else the worst case is
       one redundant refetch. */
    try {
      const p = window.F9 && window.F9.pulled_at;   // "YYYY-MM-DD HH:MM" ET
      const age = p ? (Date.now() - new Date(p.replace(" ", "T"))) / 60000 : 0;
      if (age > 20 && theKey) {
        const ne = await freshEnc();
        if (ne && ne.ct && ne.nonce !== window.F9_ENC.nonce) {
          const pt = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: b64d(ne.nonce) }, theKey, b64d(ne.ct));
          window.F9 = await toPayload(pt, ne.zip);
        }
      }
    } catch (e) {}
    const l = document.getElementById("lockscreen");
    if (l) l.remove();
    window.__FIVE9_MAIN();
  };
  const enc = window.F9_ENC;
  if (!enc) { boot(); return; }

  const ov = document.createElement("div"); ov.id = "lockscreen";
  ov.style.cssText = "position:fixed;inset:0;z-index:9999;display:flex;" +
    "align-items:center;justify-content:center;background:#12141d;";
  ov.innerHTML =
    '<div style="width:320px;max-width:90vw;background:#1a1d29;border:1px solid #313a4e;' +
    'border-radius:12px;padding:28px;font-family:system-ui,\'Segoe UI\',sans-serif;text-align:center;">' +
    '<div style="font-size:15px;font-weight:700;color:#e8eaf2;margin-bottom:2px;">Five9 Call Intelligence</div>' +
    '<div style="font-size:11px;color:#8b91a7;margin-bottom:18px;">Enter the dashboard passphrase</div>' +
    '<input id="lockpass" type="password" autocomplete="current-password" ' +
    'style="width:100%;box-sizing:border-box;background:#12141d;color:#e8eaf2;border:1px solid #313a4e;' +
    'border-radius:8px;padding:10px 12px;font-size:14px;outline:none;">' +
    '<button id="lockgo" style="width:100%;margin-top:10px;background:#8BE9FD;color:#0b0d14;border:0;' +
    'border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;">Unlock</button>' +
    '<div id="lockmsg" style="font-size:11px;color:#e8747c;margin-top:10px;min-height:14px;"></div></div>';
  document.body.appendChild(ov);
  const inp = ov.querySelector("#lockpass"), btn = ov.querySelector("#lockgo"),
        msg = ov.querySelector("#lockmsg");

  async function decryptWith(key) {
    const pt = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64d(enc.nonce) }, key, b64d(enc.ct));
    window.F9 = await toPayload(pt, enc.zip);
    theKey = key;
  }
  async function tryPass(pass) {
    const km = await crypto.subtle.importKey("raw",
      new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64d(enc.salt), iterations: enc.iter, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    await decryptWith(key);
    try { sessionStorage.setItem("five9-key",
      b64e(await crypto.subtle.exportKey("raw", key)) + "|" + enc.salt);
    } catch (e) {}
  }
  async function tryCached() {
    let cached; try { cached = sessionStorage.getItem("five9-key"); }
    catch (e) { return false; }
    if (!cached) return false;
    const [raw, salt] = cached.split("|");
    if (salt !== enc.salt) return false;   // passphrase/salt rotated
    try {
      const key = await crypto.subtle.importKey("raw", b64d(raw),
        { name: "AES-GCM" }, false, ["decrypt"]);
      await decryptWith(key);
      return true;
    } catch (e) { return false; }
  }
  async function submit() {
    msg.textContent = ""; btn.disabled = true;
    try { await tryPass(inp.value); boot(); }
    catch (e) { btn.disabled = false; inp.value = "";
      msg.textContent = "Wrong passphrase."; inp.focus(); }
  }
  btn.addEventListener("click", submit);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  /* The app's own 5-min reload only runs after unlock — keep a LOCKED tab
     fresh too, so unlocking hours later never shows old data. Holds off
     while a passphrase is being typed. */
  setTimeout(function tick() {
    if (!document.getElementById("lockscreen")) return;
    if (inp.value) { setTimeout(tick, 30000); return; }
    location.reload();
  }, 5 * 60 * 1000);
  if (!(window.crypto && crypto.subtle)) {
    msg.textContent = "This browser can't decrypt here (needs https, localhost or file://).";
    return;
  }
  if (enc.zip && typeof DecompressionStream === "undefined") {
    msg.textContent = "This browser is too old to open the dashboard — please update it.";
    return;
  }
  tryCached().then(ok => { if (ok) boot(); else inp.focus(); });
})();
</script>
