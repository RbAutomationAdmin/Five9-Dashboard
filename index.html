<!DOCTYPE html>
<html lang="en" data-theme="dracula">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five9 Call Intelligence</title>
<style>
/* ============================================================
   FIVE9 CALL INTELLIGENCE — Executive Command Center
   Sibling of Lead Ops Intelligence; same theme system.
   Themes: set data-theme on <html> — "dracula" (default),
   "command" (black/green), "industrial".
   ============================================================ */
:root, html[data-theme="dracula"] {
  --bg: #0A0D19; --side: #0C1020; --surface: #12172A; --raised: #1A2038;
  --border: #242C4C; --hairline: #1B2240;
  --accent: #8BE9FD;
  --c1: #8BE9FD; --c2: #BD93F9; --c3: #FF79C6; --c4: #FFB86C;
  --c5: #50FA7B; --c6: #6272A4;
  --good: #50FA7B; --warn: #FFB86C; --crit: #FF5555;
  --text: #F4F5FA; --muted: #8E94B4;
  --chip-hi-bg: rgba(255,85,85,.14); --chip-md-bg: rgba(255,184,108,.14);
}
html[data-theme="command"] {
  --bg: #080D0A; --side: #0A100C; --surface: #101813; --raised: #17231B;
  --border: #24402C; --hairline: #1A2B20;
  --accent: #6CC14C;
  --c1: #6CC14C; --c2: #9EDB8A; --c3: #F2B84B; --c4: #5FA8D3;
  --c5: #6CC14C; --c6: #55705C;
  --good: #6CC14C; --warn: #F2B84B; --crit: #E05A47;
  --text: #F3F7F1; --muted: #92A394;
  --chip-hi-bg: rgba(224,90,71,.16); --chip-md-bg: rgba(242,184,75,.14);
}
html[data-theme="industrial"] {
  --bg: #151719; --side: #191C1F; --surface: #202327; --raised: #2A2E33;
  --border: #3A4047; --hairline: #2C3136;
  --accent: #6CC14C;
  --c1: #6CC14C; --c2: #7A93A8; --c3: #D99A2B; --c4: #B57BD6;
  --c5: #6CC14C; --c6: #5B6169;
  --good: #6CC14C; --warn: #D99A2B; --crit: #E05A47;
  --text: #F2F3F4; --muted: #A5ABB3;
  --chip-hi-bg: rgba(224,90,71,.16); --chip-md-bg: rgba(217,154,43,.14);
}

/* ---------- base ---------- */
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; scrollbar-color: var(--border) var(--bg); }
body { background: var(--bg); color: var(--text);
  font: 13.5px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
.num { font-variant-numeric: tabular-nums; }
.micro { font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted); }
button, select { font: inherit; color: var(--text); background: var(--raised);
  border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
select { padding: 6px 10px; }
button:hover, select:hover { border-color: var(--accent); }
a { color: var(--accent); text-decoration: none; }
svg { display: block; }
svg text { font-family: "Segoe UI", system-ui, sans-serif; }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--hairline);
  padding: 18px 14px 20px; position: sticky; top: 0; height: 100vh;
  overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.brandrow { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
.logo { width: 38px; height: 38px; border-radius: 10px; background: var(--raised);
  display: grid; place-items: center; border: 1px solid var(--border); flex: none; }
.logo svg { width: 20px; height: 20px; }
.brandrow h1 { font-size: 14.5px; font-weight: 700; line-height: 1.25; }
.brandrow .sub { font-size: 10.5px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border-radius: 8px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
.nav a svg { width: 15px; height: 15px; flex: none; }
.nav a:hover { background: var(--raised); color: var(--text); }
.nav a.on { background: var(--raised); color: var(--accent); }
.side-sec { margin-top: 18px; }
.side-sec .micro { display: block; margin-bottom: 8px; }
.swatches { display: flex; gap: 10px; }
.swatch { width: 44px; height: 52px; border-radius: 10px; padding: 6px 2px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; }
.swatch .ring { width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid transparent; }
.swatch span { font-size: 8px; color: var(--muted); font-weight: 600;
  white-space: nowrap; }
.swatch.on { border-color: var(--accent); }
.swatch.on .ring { border-color: var(--text); }
.healthbox { margin-top: 16px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px; padding: 14px 12px;
  text-align: center; }
.gauge { margin: 8px auto 4px; position: relative; width: 116px; height: 116px; }
.gauge .score { position: absolute; inset: 0; display: flex;
  flex-direction: column; align-items: center; justify-content: center; }
.gauge .score b { font-size: 30px; font-weight: 750; display: block; line-height: 1.05; }
.gauge .score i { font-style: normal; font-size: 11.5px; color: var(--muted); }
.healthbox .hdelta { font-size: 11.5px; margin-top: 4px; }
.hdelta.up { color: var(--good); } .hdelta.down { color: var(--crit); }
.hdelta.flat { color: var(--muted); }

/* ---------- content ---------- */
.content { padding: 0 clamp(14px, 2vw, 26px) 40px; min-width: 0; }
.filterbar { display: flex; flex-wrap: wrap; align-items: flex-end;
  gap: 10px 16px; padding: 14px 0; position: sticky; top: 0; z-index: 30;
  background: var(--bg); }
.filterbar.scrolled { border-bottom: 1px solid var(--hairline);
  box-shadow: 0 8px 18px rgba(0,0,0,.35); }
.fcol { display: flex; flex-direction: column; gap: 4px; }
.fcol .micro { letter-spacing: .06em; }
.filterbar .grow { flex: 1; }
.updated { display: flex; align-items: center; gap: 8px; font-size: 11.5px;
  color: var(--muted); }
#refresh { width: 32px; height: 32px; border-radius: 8px; display: grid;
  place-items: center; }
#refresh svg { width: 15px; height: 15px; }

.card { background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; min-width: 0; }
.chead { display: flex; align-items: center; gap: 10px; padding: 13px 16px 0; }
.chead h2 { font-size: 13.5px; font-weight: 700; }
.chead .cap { font-size: 11px; color: var(--muted); }
.chead select { padding: 3px 8px; font-size: 11.5px; border-radius: 6px;
  margin-left: auto; }
.cbody { padding: 10px 16px 14px; }
.cbody > .micro { display: block; margin: 12px 0 5px; }
.scopechip { font-size: 10.5px; font-weight: 700; color: var(--accent);
  border: 1px solid var(--accent); border-radius: 20px; padding: 1px 8px; }

/* KPI strip */
.kpis { display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px 10px; min-width: 0; }
.kpi .top { display: flex; align-items: center; gap: 8px; }
.kpi .ico { width: 26px; height: 26px; border-radius: 7px; flex: none;
  display: grid; place-items: center; }
.kpi .ico svg { width: 14px; height: 14px; }
.kpi .lbl { font-size: 11.5px; color: var(--muted); font-weight: 600;
  line-height: 1.2; }
.kpi .v { font-size: 27px; font-weight: 750; margin-top: 6px; line-height: 1.1; }
.kpi .d { font-size: 11px; margin-top: 1px; min-height: 15px; }
.kpi .d.up { color: var(--good); } .kpi .d.down { color: var(--crit); }
.kpi .d.flat { color: var(--muted); }
.kpi .spark { margin-top: 6px; height: 26px; }

/* insight cards + alerts rail */
.midgrid { display: grid; grid-template-columns: minmax(0, 1fr) 300px;
  gap: 10px; margin-top: 10px; }
.midleft { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.insights { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px; }
.insight { background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 13px 15px; }
.insight .ihead { display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; font-weight: 700; margin-bottom: 7px; }
.insight .ihead svg { width: 16px; height: 16px; }
.insight ul { list-style: none; }
.insight li { position: relative; padding: 2.5px 0 2.5px 13px; font-size: 12px;
  color: var(--text); }
.insight li::before { content: "•"; position: absolute; left: 0; }
.insight.wins li::before { color: var(--good); }
.insight.warns li::before { color: var(--warn); }
.insight p { font-size: 12px; margin-top: 3px; }
.alertcard .cbody { padding: 4px 10px 10px; }
.alertrow { display: flex; gap: 10px; padding: 10px 6px;
  border-top: 1px solid var(--hairline); align-items: flex-start; }
.alertrow:first-child { border-top: none; }
.alertrow svg { width: 15px; height: 15px; flex: none; margin-top: 1px; }
.alertrow .t { font-size: 12.5px; font-weight: 650; line-height: 1.3; }
.alertrow .x { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.sevchip { margin-left: auto; flex: none; font-size: 10.5px; font-weight: 700;
  border-radius: 6px; padding: 2px 8px; }
.sevchip.hi { color: var(--crit); background: var(--chip-hi-bg); }
.sevchip.md { color: var(--warn); background: var(--chip-md-bg); }
.sevchip.ok { color: var(--good); background: transparent; }
.viewall { font-size: 11px; font-weight: 700; margin-left: auto;
  background: none; border: none; color: var(--accent); }

/* chart row */
.charts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 3px 14px; padding: 6px 16px 0;
  font-size: 11px; color: var(--muted); }
.legend .key { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
.legend .sw.dash { background: repeating-linear-gradient(90deg,
  currentColor 0 3px, transparent 3px 5px); }

/* bottom row */
.botgrid { display: grid; gap: 10px; margin-top: 10px;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, .9fr) minmax(0, 1fr); }
.hourgrid { display: grid; gap: 10px; margin-top: 10px;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
table.perf { width: 100%; border-collapse: collapse; font-size: 12px; }
table.perf th { text-align: right; color: var(--muted); font-weight: 700;
  font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  padding: 4px 8px 7px; border-bottom: 1px solid var(--hairline); }
table.perf th:first-child { text-align: left; }
table.perf td { padding: 8px; border-bottom: 1px solid var(--hairline);
  text-align: right; font-variant-numeric: tabular-nums; }
table.perf tr:last-child td { border-bottom: none; }
table.perf td:first-child { text-align: left; font-weight: 650; }
table.perf tr:hover td { background: var(--raised); }
.srcdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 7px; }
.cfoot { border-top: 1px solid var(--hairline); padding: 9px 16px;
  font-size: 11.5px; font-weight: 650; text-align: center; }
.cfoot a { cursor: pointer; }
.donutwrap { display: flex; align-items: center; gap: 14px; padding: 6px 0; }
.donutwrap.centered { justify-content: center; }
.formrow.wide { grid-template-columns: minmax(110px, 1.4fr) 52px
  minmax(50px, 1fr) 38px; }
.donutwrap .center { position: absolute; inset: 0; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  text-align: center; }
.donutwrap .center b { font-size: 22px; font-weight: 750; display: block; }
.donutwrap .center i { font-style: normal; font-size: 10.5px; color: var(--muted); }
.dlegend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.dlegend .row { display: flex; align-items: center; gap: 8px; font-size: 12px;
  min-width: 0; }
.dlegend .row .lbl { flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.dlegend .row b { flex: none; }
.dlegend .row i { font-style: normal; color: var(--muted); font-size: 11px;
  width: 36px; text-align: right; flex: none; }
.formrow { display: grid; grid-template-columns: minmax(90px, 1.2fr) 44px
  minmax(60px, 1fr) 40px; align-items: center; gap: 10px; padding: 6.5px 0;
  border-bottom: 1px solid var(--hairline); font-size: 12px; }
.formrow:last-child { border-bottom: none; }
.formrow .fl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.formrow .cnt { text-align: right; font-variant-numeric: tabular-nums;
  font-weight: 650; }
.formrow .track { height: 8px; background: var(--raised); border-radius: 4px;
  overflow: hidden; }
.formrow .bar { height: 100%; border-radius: 4px; }
.formrow .pctv { color: var(--muted); font-size: 11px; text-align: right; }

/* agents & teams */
.teamgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px; margin-top: 10px; }
table.mini { width: 100%; border-collapse: collapse; font-size: 12px; }
table.mini th { text-align: right; color: var(--muted); font-weight: 700;
  font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 8px 6px; border-bottom: 1px solid var(--hairline); }
table.mini th:first-child { text-align: left; }
table.mini td { padding: 5.5px 8px; border-bottom: 1px solid var(--hairline);
  text-align: right; font-variant-numeric: tabular-nums; }
table.mini td:first-child { text-align: left; }
table.mini tr:hover td { background: var(--raised); }
table.mini tr:last-child td { border-bottom: none; }
.stdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.stdot.ok { background: var(--good); } .stdot.warn { background: var(--warn); }
.stdot.crit { background: var(--crit); }

/* sortable / scrollable agent tables */
.tscroll { overflow-y: auto; scrollbar-color: var(--border) var(--surface); }
.tscroll table.mini thead th { position: sticky; top: 0; z-index: 2;
  background: var(--surface); box-shadow: 0 1px 0 var(--hairline); }
.tscroll table.mini tfoot td { position: sticky; bottom: 0; z-index: 2;
  background: var(--raised); border-top: 1px solid var(--border);
  border-bottom: none; font-weight: 700; }
table.mini tfoot tr:hover td { background: var(--raised); }
table.mini th.sortable { cursor: pointer; user-select: none; }
table.mini th.sortable:hover { color: var(--text); }
input.tsearch { font: inherit; font-size: 11.5px; color: var(--text);
  background: var(--raised); border: 1px solid var(--border); border-radius: 6px;
  padding: 3px 8px; margin-left: auto; width: 132px; }
input.tsearch:focus { outline: none; border-color: var(--accent); }
input.tsearch::placeholder { color: var(--muted); }
button.xlbtn { font: inherit; font-size: 11.5px; font-weight: 650;
  color: var(--text); background: var(--raised); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 9px; cursor: pointer; white-space: nowrap; }
button.xlbtn:hover { border-color: var(--accent); color: var(--accent); }
button.xlbtn:disabled { opacity: .55; cursor: default; }

/* dispositions multi-select dropdown */
input.dinput { font: inherit; font-size: 12.5px; color: var(--text);
  background: var(--raised); border: 1px solid var(--border); border-radius: 8px;
  padding: 5px 8px; color-scheme: dark; }
input.dinput:hover, input.dinput:focus { border-color: var(--accent); outline: none; }

.dropwrap { position: relative; }
.dropbtn { padding: 6px 10px; text-align: left; min-width: 158px; }
.dropbtn.on { border-color: var(--accent); color: var(--accent); font-weight: 650; }
.droppanel { position: absolute; top: calc(100% + 4px); left: 0; z-index: 40;
  background: var(--raised); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 10px 26px rgba(0,0,0,.5); padding: 8px; width: 250px;
  max-height: 330px; overflow-y: auto;
  scrollbar-color: var(--border) var(--raised); }
.droppanel .qrow { display: flex; gap: 12px; align-items: center;
  padding: 2px 4px 8px; font-size: 11px;
  border-bottom: 1px solid var(--hairline); margin-bottom: 4px; }
.droppanel .qrow a { cursor: pointer; font-weight: 700; }
.droppanel .qrow .hint { color: var(--muted); margin-left: auto; }
.droppanel label.drow { display: flex; align-items: center; gap: 8px;
  padding: 4px; font-size: 12px; border-radius: 6px; cursor: pointer; }
.droppanel label.drow:hover { background: var(--surface); }
.droppanel .drow .dl { flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.droppanel .drow .cnt { margin-left: auto; color: var(--muted); font-size: 11px;
  flex: none; }
.droppanel input { accent-color: var(--accent); }
.droppanel input.psearch { width: 100%; margin: 0 0 6px; box-sizing: border-box; }

/* embedded ClearView dashboard */
#clearview { margin-top: 10px; }
.cvbody { padding: 0 10px 10px; }
.cvframe { width: 100%; border: 1px solid var(--hairline); border-radius: 10px;
  background: #fff; display: block; resize: vertical; overflow: auto;
  min-height: 260px; }
.cvidle { padding: 26px 16px; text-align: center; color: var(--muted);
  font-size: 12.5px; line-height: 1.7; }
.cvbtn { padding: 6px 14px; font-size: 12px; font-weight: 650; }
.chead .cvlink { font-size: 11.5px; font-weight: 650; }

.footnote { display: flex; align-items: center; gap: 8px; margin-top: 14px;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 10px; padding: 9px 14px; font-size: 11.5px;
  color: var(--muted); }
.empty { color: var(--muted); font-size: 12px; padding: 22px 0 16px;
  text-align: center; }

/* info icons */
.infoico { display: inline-block; width: 13px; height: 13px; flex: none;
  color: var(--muted); cursor: help; vertical-align: -2px; }
.infoico:hover { color: var(--accent); }

/* tooltip */
#tip { position: fixed; z-index: 50; pointer-events: none; display: none;
  background: var(--raised); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 8px 22px rgba(0,0,0,.5); padding: 8px 11px; font-size: 12px;
  max-width: 280px; }
#tip.wide { max-width: 360px; }
#tip .ip { margin-top: 5px; color: var(--text); line-height: 1.45; }
#tip .ip.f { color: var(--c2); font-size: 11px;
  font-family: Consolas, "Courier New", monospace; }
#tip .ip.n { color: var(--muted); font-size: 11px; margin-top: 7px; }
#tip .t { color: var(--muted); font-size: 10.5px; letter-spacing: .07em;
  text-transform: uppercase; margin-bottom: 4px; }
#tip .row { display: flex; align-items: center; gap: 7px; margin-top: 2px; }
#tip .k { width: 12px; height: 3px; border-radius: 2px; }
#tip .v { font-weight: 700; font-variant-numeric: tabular-nums; }
#tip .n { color: var(--muted); }

/* responsive */
@media (max-width: 1400px) { .charts { grid-template-columns: 1fr; }
  .botgrid { grid-template-columns: 1fr 1fr; }
  .hourgrid { grid-template-columns: 1fr; } }
@media (max-width: 1100px) { .midgrid { grid-template-columns: 1fr; }
  .insights { grid-template-columns: 1fr; }
  .botgrid, .teamgrid { grid-template-columns: 1fr; } }
@media (max-width: 900px) { .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row;
    flex-wrap: wrap; align-items: center; }
  .nav, .healthbox { display: none; } .side-sec { margin: 0 0 0 auto; } }
</style>
</head>
<body>
<div class="app">
  <!-- ================= SIDEBAR ================= -->
  <aside class="side">
    <div class="brandrow">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.4 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg></div>
      <div><h1>Five9 Call Intelligence</h1><div class="sub">Executive Command Center</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-sec">
      <span class="micro">Theme switcher</span>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="healthbox" id="healthbox">
      <span class="micro">Call center health</span>
      <div class="gauge" id="gauge"></div>
      <div class="hdelta" id="hdelta"></div>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="content">
    <div class="filterbar" id="filterbar"></div>
    <div id="app"></div>
    <!-- lives outside #app so re-rendering on a filter change never
         reloads the embedded dashboard -->
    <div id="clearview"></div>
    <div class="footnote" id="footnote"></div>
  </main>
</div>
<div id="tip"></div>

<script src="data.js"></script>
<script src="departments.js"></script>
<script>
"use strict";
/* The whole app is deferred behind __FIVE9_MAIN(); the unlock gate at the
   bottom of this file decrypts window.F9_ENC (data.js is encrypted at rest)
   and then boots. Plaintext window.F9 (legacy) or no data at all (sample
   mode) boots straight through. */

  if (agentToo && DEPT_SEL && !DEPT_SEL.has(deptOf(r.ag))) return false;
  return true;
}
const inRange = (items, days) => days == null ? items
  : items.filter(r => days.includes(etDay(r.d)));

/* ============================================================
   Utils
   ============================================================ */
const sum = a => a.reduce((x, y) => x + y, 0);
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y);
  const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const fmt = n => n == null ? "—" : n.toLocaleString("en-US");
const pct = (n, d) => d ? Math.round(100 * n / d) + "%" : "—";
const pctN = (n, d) => d ? Math.round(100 * n / d) : null;
const fmtSec = s => { if (s == null) return "—"; s = Math.round(s);
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return m + ":" + String(r).padStart(2, "0");
  return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; };
const fmtHrs = s => s == null ? "—" : (Math.round(s / 360) / 10) + "h";
const counter = (items, key) => { const m = new Map();
  for (const r of items) { const k = key(r); if (k == null) continue;
    m.set(k, (m.get(k) || 0) + 1); } return m; };
function el(tag, attrs, parent) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e); return e;
}
function h(tag, cls, parent, text) {
  const e = document.createElement(tag); if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e); return e;
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function niceMax(v) { if (!isFinite(v) || v <= 4) return 4;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 4, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
const hasPrev = prev => prev != null && prev.length > 0;
function pctDelta(cur, prev) {
  if (typeof prev !== "number" || prev === 0 || typeof cur !== "number") return null;
  return Math.round(100 * (cur - prev) / prev);
}

const tip = document.getElementById("tip");
function showTip(evt, title, rows) {
  tip.textContent = "";

  for (const r of rows) {
    const row = h("div", "row", tip);
    h("span", "k", row).style.background = r.color || "transparent";
    h("span", "v", row, r.value);
    h("span", "n", row, r.name);
  }

}

/* ============================================================
   CHARTS — gradient area lines, bars, sparkline, donut.
   ============================================================ */
let GRAD = 0;
function lineArea(host, days, series, { height = 210, y2 = null } = {}) {
  const W = 560, H = height, L = 38, R = y2 ? 40 : 14, T = 14, B = 22;
  const anyData = series.some(s => s.values.some(v => v != null && v > 0));
  if (!anyData) { h("div", "empty", host, "No data in window"); return; }
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}` }, null);
  const defs = el("defs", {}, svg);
  const maxOf = axis => niceMax(Math.max(...series.filter(s => (s.axis || "y") === axis)
    .flatMap(s => s.values.map(v => v || 0)), 0));
  const ymax = maxOf("y"), y2max = y2 ? maxOf("y2") : 0;
  const px = i => L + (W - L - R) * (days.length === 1 ? 0.5 : i / (days.length - 1));
  const py = (v, axis) => T + (H - T - B) * (1 - v / ((axis === "y2") ? y2max : ymax));
  for (let i = 0; i <= 4; i++) {
    const y = T + (H - T - B) * i / 4;
    el("line", { x1: L, x2: W - R, y1: y, y2: y,
      stroke: i === 4 ? css("--border") : css("--hairline"), "stroke-width": 1 }, svg);
    el("text", { x: L - 6, y: y + 3.5, "text-anchor": "end", "font-size": 9.5,
      fill: css("--muted"), style: "font-variant-numeric:tabular-nums" }, svg)
      .textContent = Math.round(ymax * (4 - i) / 4).toLocaleString();
    if (y2) el("text", { x: W - R + 6, y: y + 3.5, "font-size": 9.5,
      fill: css("--muted") }, svg)
      .textContent = (y2.fmt || (v => v))(Math.round(y2max * (4 - i) / 4));
  }
  const tickEvery = Math.ceil(days.length / 8);
  days.forEach((d, i) => { if (i % tickEvery === 0)
    el("text", { x: px(i), y: H - 7, "text-anchor": "middle", "font-size": 9.5,
      fill: css("--muted") }, svg).textContent = shortDay(d); });
  series.forEach(s => {
    const pts = days.map((d, i) =>
      s.values[i] == null ? null : [px(i), py(s.values[i], s.axis || "y")]);
    let path = "", started = false;
    pts.forEach(p => { if (!p) { started = false; return; }
      path += (started ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1);
      started = true; });
    if (!path) return;
    const solid = pts.filter(Boolean);
    if (s.area && solid.length > 1) {
      const gid = "g" + (++GRAD);
      const grad = el("linearGradient", { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
      el("stop", { offset: "0%", "stop-color": s.color, "stop-opacity": .28 }, grad);
      el("stop", { offset: "100%", "stop-color": s.color, "stop-opacity": 0 }, grad);
      el("path", { d: path + `L${solid[solid.length - 1][0]},${py(0, s.axis || "y")}` +
        `L${solid[0][0]},${py(0, s.axis || "y")} Z`, fill: `url(#${gid})` }, svg);
    }
    el("path", { d: path, fill: "none", stroke: s.color, "stroke-width": 2,
      "stroke-linejoin": "round", "stroke-linecap": "round",
      ...(s.dashed ? { "stroke-dasharray": "5 4" } : {}) }, svg);
    const li = pts.map((p, i) => p ? i : -1).filter(i => i >= 0).pop();
    if (li != null && li >= 0)
      el("circle", { cx: pts[li][0], cy: pts[li][1], r: 3.5, fill: s.color,
        stroke: css("--surface"), "stroke-width": 2 }, svg);
  });
  const cross = el("line", { y1: T, y2: H - B, stroke: css("--muted"),
    "stroke-width": 1, opacity: 0 }, svg);
  const hit = el("rect", { x: 0, y: 0, width: W, height: H, fill: "transparent" }, svg);
  hit.addEventListener("pointermove", e => {
    const box = svg.getBoundingClientRect();
    const xu = (e.clientX - box.left) / box.width * W;
    const i = Math.max(0, Math.min(days.length - 1,
      Math.round((xu - L) / ((W - L - R) / (days.length - 1 || 1)))));
    cross.setAttribute("x1", px(i)); cross.setAttribute("x2", px(i));
    cross.setAttribute("opacity", .45);
    showTip(e, shortDay(days[i]), series.map(s => ({ color: s.color, name: s.label,
      value: s.values[i] == null ? "—" : (s.fmtV || fmt)(s.values[i]) })));
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); hideTip(); });
  host.appendChild(svg);
}

/* grouped hourly bars: series = [{label,color,values[24]}] */
function hourBars(host, series, { height = 190, fmtV = fmt, hourFrom = 6, hourTo = 23,
    labels = false } = {}) {
  const hours = []; for (let i = hourFrom; i <= hourTo; i++) hours.push(i);
  /* value labels sit above each bar — reserve a little headroom for them */
  const W = 720, H = height, L = 34, R = 8, T = labels ? 18 : 12, B = 22;
  const barLabel = v => v >= 10 ? String(Math.round(v))
    : String(Math.round(v * 10) / 10);
  const labelQueue = [];
  const ymax = niceMax(Math.max(...series.flatMap(s =>
    hours.map(hh => s.values[hh] || 0)), 0));
  if (!ymax) { h("div", "empty", host, "No data in window"); return; }
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}` }, null);
  for (let i = 0; i <= 4; i++) {
    const y = T + (H - T - B) * i / 4;
    el("line", { x1: L, x2: W - R, y1: y, y2: y,
      stroke: i === 4 ? css("--border") : css("--hairline"), "stroke-width": 1 }, svg);
    el("text", { x: L - 5, y: y + 3.5, "text-anchor": "end", "font-size": 9.5,
      fill: css("--muted") }, svg)
      .textContent = Math.round(ymax * (4 - i) / 4).toLocaleString();
  }
  const slot = (W - L - R) / hours.length;
  const bw = Math.max((slot - 6) / series.length, 3);
  hours.forEach((hh, i) => {
    const hLabel = hh === 0 ? "12a" : hh < 12 ? hh + "a" : hh === 12 ? "12p" : (hh - 12) + "p";
    if (i % 2 === 0)
      el("text", { x: L + slot * (i + .5), y: H - 7, "text-anchor": "middle",
        "font-size": 9.5, fill: css("--muted") }, svg).textContent = hLabel;
    series.forEach((s, si) => {
      const v = s.values[hh] || 0;
      const bh = (H - T - B) * v / ymax;
      const bx = L + slot * i + 3 + si * bw;
      const r = el("rect", { x: bx, y: H - B - bh,
        width: bw - 1, height: Math.max(bh, v ? 1 : 0), rx: 1.5,
        fill: s.color, opacity: .9 }, svg);

        series.map(s2 => ({ color: s2.color, name: s2.label,
          value: fmtV(s2.values[hh] || 0) }))));
      r.addEventListener("pointerleave", hideTip);
      if (labels && v > 0)

          cx: bx + (bw - 1) / 2, cy: H - B - bh - 3 });

     biggest numbers first and skip any that would collide — the hover

    const free = box => !placed.some(p => box.x1 < p.x2 && box.x2 > p.x1

    labelQueue.sort((a, b) => b.v - a.v).forEach(c => {
      const w = c.text.length * FS * 0.62 + 2;
      const x1 = c.cx - w / 2, x2 = c.cx + w / 2;
      if (x1 < L || x2 > W - R) return;

      let y = c.cy, box = null;

        fill: c.color, style: "font-variant-numeric:tabular-nums" }, svg);

      if (y < c.cy - 2)

          stroke: c.color, "stroke-width": .6, opacity: .35 }, svg);

function sparkline(host, values, color, { bars = false } = {}) {
  const W = 110, H = 26, P = 2;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "spark" }, null);
  svg.style.width = "100%"; svg.style.height = "26px";
  const vs = values.map(v => v || 0);
  const max = Math.max(...vs, 1);
  if (bars) {
    const bw = Math.max((W - 2 * P) / vs.length - 2, 2);
    vs.forEach((v, i) => el("rect", {
      x: P + i * (W - 2 * P) / vs.length, y: H - P - (H - 2 * P) * v / max,
      width: bw, height: Math.max((H - 2 * P) * v / max, 1), rx: 1,
      fill: color, opacity: .85 }, svg));
  } else {
    const px = i => P + (W - 2 * P) * (vs.length === 1 ? .5 : i / (vs.length - 1));
    const py = v => H - P - (H - 2 * P) * v / max;
    let d = "";
    vs.forEach((v, i) => { d += (i ? "L" : "M") + px(i).toFixed(1) + "," + py(v).toFixed(1); });
    const gid = "g" + (++GRAD);
    const defs = el("defs", {}, svg);
    const grad = el("linearGradient", { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    el("stop", { offset: "0%", "stop-color": color, "stop-opacity": .3 }, grad);
    el("stop", { offset: "100%", "stop-color": color, "stop-opacity": 0 }, grad);
    el("path", { d: d + `L${px(vs.length - 1)},${H - P} L${px(0)},${H - P} Z`,
      fill: `url(#${gid})` }, svg);
    el("path", { d, fill: "none", stroke: color, "stroke-width": 1.6 }, svg);
  }
  host.appendChild(svg);
}

function donut(host, segments, centerTop, centerBottom, { legend = true } = {}) {
  const total = sum(segments.map(s => s.value));
  const wrap = h("div", "donutwrap" + (legend ? "" : " centered"), host);
  const dbox = h("div", null, wrap);
  dbox.style.position = "relative"; dbox.style.width = "150px";
  dbox.style.height = "150px"; dbox.style.flex = "none";
  const svg = el("svg", { viewBox: "0 0 42 42" }, null);
  svg.style.width = "150px"; svg.style.height = "150px";
  const R2 = 15.9159; const CIRC = 100;
  el("circle", { cx: 21, cy: 21, r: R2, fill: "none",
    stroke: css("--raised"), "stroke-width": 6 }, svg);
  let off = 25;
  segments.forEach(s => {
    if (!s.value) return;
    const frac = 100 * s.value / total;
    const c = el("circle", { cx: 21, cy: 21, r: R2, fill: "none",
      stroke: s.color, "stroke-width": 6, "stroke-linecap": "butt",
      "stroke-dasharray": `${Math.max(frac - 1, .5)} ${CIRC - Math.max(frac - 1, .5)}`,
      "stroke-dashoffset": off }, svg);
    off -= frac;
    c.style.cursor = "default";
    c.addEventListener("pointermove", e => showTip(e, s.label,
      [{ color: s.color, name: pct(s.value, total) + " of calls", value: fmt(s.value) }]));
    c.addEventListener("pointerleave", hideTip);
  });
  dbox.appendChild(svg);
  const center = h("div", "center", dbox);
  h("b", "num", center, centerTop);
  h("i", null, center, centerBottom);
  if (legend) {
    const lg = h("div", "dlegend", wrap);
    segments.forEach(s => {
      const row = h("div", "row", lg);
      row.title = `${s.label} — ${fmt(s.value)} (${pct(s.value, total)})`;
      const dot = h("span", "srcdot", row); dot.style.background = s.color;
      h("span", "lbl", row, s.label);
      h("i", "num", row, pct(s.value, total));
      h("b", "num", row, fmt(s.value));

}

/* ============================================================
   SORT TABLE — sortable / searchable / scrollable mini table.
   cols: [{label, key, str?, nosort?, fmt?(val,row)}]
   rows: array of plain objects; returns {setQuery} for a search box.
   ============================================================ */
function sortTable(host, cols, rows, { defaultKey, maxH = 420 } = {}) {
  let sortKey = defaultKey, sortDir = -1, query = "";
  let shown = rows;          // rows currently in view — what the export writes
  const wrap = h("div", "tscroll", host);
  wrap.style.maxHeight = maxH + "px";
  const tbl = h("table", "mini", wrap);
  const thr = h("tr", null, h("thead", null, tbl));
  cols.forEach(c => {
    const th = h("th", c.nosort ? null : "sortable", thr, c.label);
    if (!c.nosort) {
      th.title = "Click to sort";
      th.addEventListener("click", () => {
        if (sortKey === c.key) sortDir = -sortDir;
        else { sortKey = c.key; sortDir = c.str ? 1 : -1; }
        draw();
      });
    }
  });
  const tbody = h("tbody", null, tbl);
  const tfoot = h("tfoot", null, tbl);
  const draw = () => {
    tbody.textContent = "";
    tfoot.textContent = "";
    [...thr.children].forEach((th, i) => {
      const c = cols[i];
      th.textContent = c.label + (c.key === sortKey && !c.nosort
        ? (sortDir < 0 ? " ▾" : " ▴") : "");
    });
    let list = query
      ? rows.filter(r => String(r.name || "").toLowerCase().includes(query))
      : rows;
    const col = cols.find(c => c.key === sortKey);
    list = [...list].sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      if (x == null && y == null) return 0;
      if (x == null) return 1;
      if (y == null) return -1;
      return (col && col.str
        ? String(x).localeCompare(String(y)) : x - y) * sortDir;
    });
    shown = list;
    for (const r of list) {
      const tr = h("tr", null, tbody);
      cols.forEach(c => {
        const td = h("td", c.str ? null : "num", tr);
        const v = c.fmt ? c.fmt(r[c.key], r) : r[c.key];
        if (v instanceof Node) td.appendChild(v);
        else td.textContent = v == null ? "—" : v;
      });
    }
    if (!list.length) {
      const tr = h("tr", null, tbody);
      const td = h("td", null, tr, "No agents match");
      td.colSpan = cols.length;
      td.style.textAlign = "center"; td.style.color = "var(--muted)";
    }
    /* totals row — pinned to the bottom of the scroll area, and computed
       from the rows currently in view (so it follows the search box) */
    if (list.length && cols.some(c => c.total)) {
      const tr = h("tr", null, tfoot);
      cols.forEach(c => {
        const td = h("td", c.str ? null : "num", tr);
        if (!c.total) return;
        const v = c.total(list);
        if (v instanceof Node) td.appendChild(v);
        else td.textContent = v == null ? "—" : v;
      });
    }
  };
  draw();
  return { setQuery: q => { query = q.trim().toLowerCase(); draw(); },
    /* what the Excel export ships: the rows on screen, in the sort the
       user is looking at, after the search box has filtered them */
    visible: () => shown, queryText: () => query };
}

  inp.className = "tsearch"; inp.type = "search";
  inp.placeholder = "Search agent…";
  inp.addEventListener("input", () => api.setQuery(inp.value));
  headEl.appendChild(inp);
}

/* ============================================================
   Per-day helpers + weekly rollup
   ============================================================ */
function trendWindow() {
  if (FILT.range === "custom") {
    const ds = enumDays(FILT.from, FILT.to);
    return ds.length >= 2 ? ds : lastDays(THRESHOLDS.trendDays);
  }
  if (FILT.range === "all") {
    const all = new Set();
    for (const r of CALLS) { const d = etDay(r.d); if (d) all.add(d); }
    const sorted = [...all].sort();
    return sorted.length ? sorted : lastDays(THRESHOLDS.trendDays);
  }
  return lastDays(THRESHOLDS.trendDays);
}
function dailyCounts(items, days, f) {
  const set = new Map(days.map(d => [d, 0]));
  for (const r of items) { const d = etDay(r.d);
    if (set.has(d) && (!f || f(r))) set.set(d, set.get(d) + 1); }
  return days.map(d => set.get(d));
}
function weekly(days, values, agg) {
  const buckets = new Map();
  days.forEach((d, i) => {
    const dt = new Date(d + "T12:00:00");
    const wk = new Date(dt - ((dt.getDay() + 6) % 7) * 86400e3)
      .toISOString().slice(0, 10);
    if (!buckets.has(wk)) buckets.set(wk, []);
    if (values[i] != null) buckets.get(wk).push(values[i]);
  });
  const ks = [...buckets.keys()].sort();
  return { days: ks, values: ks.map(k => {
    const v = buckets.get(k);
    if (!v.length) return null;
    return agg === "median" ? Math.round(median(v)) : sum(v); }) };
}

/* ============================================================
   ALERT ENGINE — {sev:"crit"|"warn", title, detail, chip}
   ============================================================ */
/* Age of the snapshot counted ONLY over the reporting window (Five9 emails
   the feeds 7a–11p ET; nothing can refresh overnight). Without this, every
   morning until the ~7:20 sync — and any overnight viewer — got a false
   "data feed stale" alarm about a by-design gap. */
const REPORT_WINDOW = [420, 1380];   // 7:00–23:00, minutes from midnight ET
function reportWindowAgeMin(pulledAt) {
  const from = new Date(pulledAt.replace(" ", "T")), now = new Date();
  if (!(+from) || from >= now) return 0;
  let total = 0;
  const day = new Date(from); day.setHours(0, 0, 0, 0);
  for (; day < now; day.setDate(day.getDate() + 1)) {
    const o = new Date(+day + REPORT_WINDOW[0] * 60000);
    const cl = new Date(+day + REPORT_WINDOW[1] * 60000);
    const lo = Math.max(+from, +o), hi = Math.min(+now, +cl);
    if (hi > lo) total += (hi - lo) / 60000;
  }
  return total;
}
function buildAlerts(c, agdays) {
  const out = [];
  if (LIVE && D.pulled_at) {
    const mins = reportWindowAgeMin(D.pulled_at);
    if (mins > THRESHOLDS.staleDataWarnMin)
      out.push({ sev: mins > 180 ? "crit" : "warn", title: "Data feed stale",
        chip: Math.round(mins) + "m",
        detail: "data.js has not refreshed within the 7a–11p reporting "
          + "window — check the Five9 Dashboard Sync task." });
  }
  const inb = c.filter(isIn);
  const ab = inb.filter(r => r.ab).length;
  const abPct = pctN(ab, inb.length);
  if (inb.length >= 20 && abPct >= THRESHOLDS.abandonWarnPct)
    out.push({ sev: abPct >= THRESHOLDS.abandonCritPct ? "crit" : "warn",
      title: "Abandon rate elevated", chip: abPct + "%",
      detail: `${fmt(ab)} of ${fmt(inb.length)} inbound calls hung up before an agent.` });
  const asa = median(inb.filter(isAnswered).map(r => r.qw).filter(v => v != null));
  if (asa != null && asa > THRESHOLDS.asaWarnSec)
    out.push({ sev: asa > THRESHOLDS.asaCritSec ? "crit" : "warn",
      title: "Speed of answer slipping", chip: fmtSec(asa),
      detail: `Median wait before an agent picks up is above the ${THRESHOLDS.asaWarnSec}s bar.` });
  const slP = pctN(inb.filter(inSL).length, inb.length);
  if (inb.length >= 20 && slP != null && slP < THRESHOLDS.slWarnPct)
    out.push({ sev: slP < THRESHOLDS.slWarnPct - 10 ? "crit" : "warn",
      title: "Service level below target", chip: slP + "%",
      detail: `Only ${slP}% of inbound answered within ${THRESHOLDS.slTargetSec}s (target ${THRESHOLDS.slWarnPct}%).` });
  /* volume spike vs trailing week (days that have data) */
  const wkDays = lastDays(7, 1).filter(d => CALLS.some(r => etDay(r.d) === d));
  const avgIn = wkDays.length
    ? inRange(CALLS.filter(isIn), wkDays).length / wkDays.length : 0;
  const todayIn = inRange(CALLS.filter(isIn), lastDays(1)).length;
  if (wkDays.length >= 3 && avgIn >= 30 && todayIn > avgIn * THRESHOLDS.volumeSpikeFactor)
    out.push({ sev: "warn", title: "Inbound volume spiking", chip: fmt(todayIn) + " today",
      detail: `vs ${Math.round(avgIn)}/day trailing average — watch queue coverage.` });
  /* per-skill trouble */
  const bySkill = new Map();
  for (const r of inb) { const k = r.sk || "(none)";
    if (!bySkill.has(k)) bySkill.set(k, { n: 0, ab: 0, waits: [] });
    const o = bySkill.get(k); o.n++;
    if (r.ab) o.ab++;
    else if (isAnswered(r) && r.qw != null) o.waits.push(r.qw); }
  [...bySkill].filter(([, o]) => o.n >= THRESHOLDS.minCallsForSkillAlert)
    .forEach(([k, o]) => {
      const p = pctN(o.ab, o.n);
      if (p >= THRESHOLDS.abandonCritPct + 3)
        out.push({ sev: "warn", ack: ACKNOWLEDGED["abandon:" + k],
          title: `${k} queue losing callers`, chip: p + "%",
          detail: `${o.ab} of ${o.n} inbound ${k} calls abandoned.` });
      else { const m = median(o.waits);
        if (m != null && m > THRESHOLDS.asaCritSec)
          out.push({ sev: "warn", ack: ACKNOWLEDGED["asa:" + k],
            title: `${k} queue answering slowly`, chip: fmtSec(m),
            detail: `Median ${k} wait is ${fmtSec(m)}.` }); }
    });
  /* team wrap time (needs handle+talk on the call rows) */
  const wraps = c.map(wrapSec).filter(v => v != null);
  const acwAvg = wraps.length >= 20 ? sum(wraps) / wraps.length : null;
  if (acwAvg != null && acwAvg > THRESHOLDS.acwWarnSec)
    out.push({ sev: "warn", title: "Wrap time running long", chip: fmtSec(acwAvg),
      detail: `Average after-call work per handled call is above the ${THRESHOLDS.acwWarnSec}s bar.` });
  /* per-agent unscheduled breaks (needs the agent summary feed) */
  if (agdays && agdays.length) {
    const byAg = new Map();
    for (const r of agdays) { if (!byAg.has(r.ag)) byAg.set(r.ag, { lg: 0, ub: 0 });
      const o = byAg.get(r.ag); o.lg += r.lg || 0; o.ub += r.ub || 0; }
    [...byAg]
      .filter(([, o]) => o.lg >= THRESHOLDS.ubMinStaffedHrs * 3600 && o.ub > 0)
      .map(([ag, o]) => [ag, Math.round(100 * o.ub / o.lg), o])
      .filter(([, p]) => p >= THRESHOLDS.ubWarnPct)
      .sort((x, y) => y[1] - x[1]).slice(0, 2)
      .forEach(([ag, p, o]) => out.push({
        sev: p >= THRESHOLDS.ubCritPct ? "crit" : "warn",
        ack: ACKNOWLEDGED["break:" + ag],
        title: `${ag} heavy unscheduled breaks`, chip: p + "%",
        detail: `${fmtSec(o.ub)} unscheduled break across ${fmtHrs(o.lg)} staffed.` }));
  }
  /* AVAILABLE BUT NOT CONNECTING — the agent sat in Ready (so the roster says
     they were available) while the ACD's deliveries rang out unanswered. That
     combination is the signature of a station/softphone fault or someone Ready
     while away from the desk — NOT of a slow agent, so it deserves a look at
     the equipment before any coaching. Reported per DEPARTMENT when several
     people trip together, because a shared cause is far likelier than N
     simultaneous individual habits. */
  if (agdays && agdays.length) {
    const per = new Map();
    for (const r of agdays) {
      if (r.mr == null) continue;              /* day predates the metric */
      if (!per.has(r.ag)) per.set(r.ag, { lg: 0, rd: 0, mr: 0, c: 0 });
      const o = per.get(r.ag);
      o.lg += r.lg || 0; o.rd += r.rd || 0;
      o.mr += r.mr || 0; o.c += r.c || 0;
    }
    const trip = [];
    for (const [ag, o] of per) {
      if (o.lg < THRESHOLDS.readyStuckMinStaffedHrs * 3600) continue;
      if (o.mr < THRESHOLDS.readyStuckMinMissed) continue;
      const readyP = Math.round(100 * o.rd / o.lg);
      if (readyP < THRESHOLDS.readyStuckMinReadyPct) continue;
      const ratio = o.mr / Math.max(o.c, 1);
      if (ratio < THRESHOLDS.readyStuckRatioWarn) continue;
      trip.push({ ag, o, readyP, ratio });
    }
    trip.sort((x, y) => y.ratio - x.ratio);
    const byDept = new Map();
    for (const t of trip) {
      const d = deptOf(t.ag);
      if (!byDept.has(d)) byDept.set(d, []);
      byDept.get(d).push(t);
    }
    [...byDept].sort((a, b) => b[1].length - a[1].length)
      .forEach(([d, list]) => {
        if (list.length >= THRESHOLDS.readyStuckDeptMin) {
          const mr = sum(list.map(t => t.o.mr)), cc = sum(list.map(t => t.o.c));
          out.push({ sev: "crit", ack: ACKNOWLEDGED["readystuck:" + d],
            title: `${d}: available but calls not connecting`,
            chip: `${list.length} agents`,
            detail: `${fmt(mr)} deliveries rang out unanswered against `
              + `${fmt(cc)} connected calls while these agents sat Ready. `
              + `${list.length} people at once points at a shared station, `
              + `network or ring-timeout fault — check the equipment first.` });
        } else {
          list.slice(0, 2).forEach(t => out.push({
            sev: t.ratio >= THRESHOLDS.readyStuckRatioCrit ? "crit" : "warn",
            ack: ACKNOWLEDGED["readystuck:" + t.ag],
            title: `${t.ag} available but not connecting`,
            chip: `${fmt(t.o.mr)} missed`,
            detail: `Ready ${t.readyP}% of ${fmtHrs(t.o.lg)} staffed, yet `
              + `${fmt(t.o.mr)} deliveries rang out against `
              + `${fmt(t.o.c)} connected calls — check the station first.` }));
        }
      });
  }
  const rank = x => x.ack ? 2 : x.sev === "crit" ? 0 : 1;
  out.sort((x, y) => rank(x) - rank(y));
  return out;
}

/* ============================================================
   HEALTH SCORE — composite 0–100 from the current slice
   ============================================================ */
function healthScore(c, alerts) {
  const inb = c.filter(isIn);
  const abPct = inb.length ? 100 * inb.filter(r => r.ab).length / inb.length : 0;
  const slP = inb.length ? 100 * inb.filter(inSL).length / inb.length : null;
  const live = alerts.filter(x => !x.ack);
  let s = 100;
  s -= live.filter(x => x.sev === "crit").length * 14;
  s -= live.filter(x => x.sev === "warn").length * 5;
  s -= Math.max(0, abPct - 5) * 1.5;
  if (slP != null) s -= Math.max(0, THRESHOLDS.slWarnPct - slP) * 0.5;
  return Math.max(5, Math.min(100, Math.round(s)));
}

/* ============================================================

   ============================================================ */
function renderFilterbar() {
  const bar = document.getElementById("filterbar");
  bar.textContent = "";
  const mkSel = (label, key, options, extraCap) => {
    const c = h("div", "fcol", bar);
    h("span", "micro", c, label + (extraCap ? " · " + extraCap : ""));
    const s = h("select", null, c);
    options.forEach(([v, txt]) => {
      const o = h("option", null, s, txt); o.value = v;
      if (FILT[key] === v) o.selected = true; });
    s.addEventListener("change", () => { FILT[key] = s.value; saveFilters(); render(); });
  };
  const today = lastDays(1)[0], d7 = lastDays(7);
  mkSel("Date range", "range", [
    ["today", "Today · " + shortDay(today)],
    ["yday", "Yesterday · " + shortDay(lastDays(1, 1)[0])],
    ["7d", `Last 7 days · ${shortDay(d7[0])} – ${shortDay(d7[6])}`],
    ["all", `Last ${D.days_kept || 30} days`],
    ["custom", FILT.range === "custom"
      ? `Custom · ${shortDay(FILT.from)} – ${shortDay(FILT.to)}`
      : "Custom range…"]]);
  if (FILT.range === "custom") {
    const dataDays = [...new Set(CALLS.map(r => etDay(r.d)))].sort();
    const mkDate = (label, key) => {
      const c2 = h("div", "fcol", bar);
      h("span", "micro", c2, label);
      const inp = document.createElement("input");
      inp.type = "date"; inp.className = "dinput";
      inp.value = FILT[key];
      if (dataDays.length) inp.min = dataDays[0];
      inp.max = today;
      inp.addEventListener("change", () => {
        if (!DAY_RE.test(inp.value)) return;
        FILT[key] = inp.value;
        if (FILT.from > FILT.to) {
          const t = FILT.from; FILT.from = FILT.to; FILT.to = t;
        }
        saveFilters(); render();
      });
      c2.appendChild(inp);
    };
    mkDate("From", "from");
    mkDate("To", "to");
  }
  mkSel("Call type", "ctype", [["all", "All Calls"], ["in", "Inbound"],
    ["out", "Outbound"]]);
  /* include/exclude checkbox dropdowns — shared component, applies on close */
  const mkMulti = (label, key, options, allLabel, { search = false, cap = "" } = {}) => {
    const c = h("div", "fcol", bar);
    h("span", "micro", c, label + (cap ? " · " + cap : ""));
    const wrap = h("div", "dropwrap", c);
    const active = Array.isArray(FILT[key]);
    const btn = h("button", "dropbtn" + (active ? " on" : ""), wrap,
      active ? `${FILT[key].length} of ${options.length} included` : allLabel);
    let sel = null;
    const outside = e => { if (!wrap.contains(e.target)) close(true); };
    const close = (apply) => {
      const p = wrap.querySelector(".droppanel");
      if (!p) return;
      p.remove();
      document.removeEventListener("pointerdown", outside);
      if (apply && sel) {
        FILT[key] = (sel.size === 0 || sel.size === options.length)
          ? null : [...sel];
        syncSelSets();
        saveFilters(); render();
      }
    };
    const open = () => {
      sel = new Set(FILT[key] || options.map(([d]) => d));
      const p = h("div", "droppanel", wrap);
      const q = h("div", "qrow", p);
      const aAll = h("a", null, q, "All");
      const aNone = h("a", null, q, "None");
      h("span", "hint", q, "applies on close");
      let sInp = null;
      if (search) {
        sInp = document.createElement("input");
        sInp.className = "tsearch psearch"; sInp.type = "search";
        sInp.placeholder = "Search…";
        p.appendChild(sInp);
      }
      const rowsBox = h("div", null, p);
      const drawRows = () => {
        rowsBox.textContent = "";
        const qq = sInp ? sInp.value.trim().toLowerCase() : "";
        options.forEach(([d, n]) => {
          if (qq && !String(d).toLowerCase().includes(qq)) return;
          const row = h("label", "drow", rowsBox);
          row.title = d;
          const cb = document.createElement("input");
          cb.type = "checkbox"; cb.value = d; cb.checked = sel.has(d);
          cb.addEventListener("change", () =>
            cb.checked ? sel.add(d) : sel.delete(d));
          row.appendChild(cb);
          h("span", "dl", row, d);
          h("span", "cnt num", row, fmt(n));
        });
      };
      aAll.addEventListener("click", () => {
        sel = new Set(options.map(([d]) => d)); drawRows(); });
      aNone.addEventListener("click", () => { sel = new Set(); drawRows(); });
      if (sInp) sInp.addEventListener("input", drawRows);
      drawRows();
      document.addEventListener("pointerdown", outside);
    };
    btn.addEventListener("click", () => {
      if (wrap.querySelector(".droppanel")) close(true); else open();
    });
  };
  mkMulti("Campaign", "camps", ALL_CAMPS, "All Campaigns", { search: true });
  mkMulti("Skill / Queue", "skills", ALL_SKILLS, "All Skills");
  mkMulti("Dispositions", "disp", ALL_DISPS, "All Dispositions", { search: true });
  mkMulti("Department", "depts", ALL_DEPTS, "All Departments",
    { cap: "agent panels" });
  mkMulti("Agent", "agents", ALL_AGENTS, "All Agents",
    { search: true, cap: "agent panels" });
  h("div", "grow", bar);
  const upd = h("div", "updated", bar);
  const updText = h("span", null, upd);
  if (D.pulled_at) {
    const mins = Math.max(0, Math.round(
      (Date.now() - new Date(D.pulled_at.replace(" ", "T"))) / 60000));
    updText.textContent = "Last updated " + (mins < 60 ? mins + " min ago"
      : Math.round(mins / 60 * 10) / 10 + " h ago");
  } else updText.textContent = "Sample data";
  const rb = h("button", null, upd); rb.id = "refresh"; rb.title = "Reload";
  rb.appendChild(icon("refresh", "currentColor", 15));
  rb.addEventListener("click", () => location.reload());
}

function scrollSpy() {
  const links = [...document.querySelectorAll("#nav a")];
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => { if (!en.isIntersecting) return;
      links.forEach(l => l.classList.toggle("on",
        l.getAttribute("href") === "#" + en.target.id)); });
  }, { rootMargin: "-25% 0px -65% 0px" });
  NAV.forEach(([id]) => { const n = document.getElementById(id);
    if (n) obs.observe(n); });
}
function renderGauge(score, prevScore) {
  const micro = document.querySelector("#healthbox .micro");
  if (micro && !micro.querySelector(".infoico")) {
    micro.append(" ");
    infoIcon(micro, "Call center health");
  }
  const g = document.getElementById("gauge");
  g.textContent = "";
  const svg = el("svg", { viewBox: "0 0 42 42" }, null);
  svg.style.width = "116px"; svg.style.height = "116px";
  el("circle", { cx: 21, cy: 21, r: 15.9159, fill: "none",
    stroke: css("--raised"), "stroke-width": 4.4 }, svg);
  const col = score >= 80 ? css("--good") : score >= 60 ? css("--warn") : css("--crit");
  el("circle", { cx: 21, cy: 21, r: 15.9159, fill: "none",
    stroke: col, "stroke-width": 4.4, "stroke-linecap": "round",
    "stroke-dasharray": `${score} ${100 - score}`, "stroke-dashoffset": 25 }, svg);
  g.appendChild(svg);
  const sc = h("div", "score", g);
  h("b", "num", sc, String(score));
  h("i", null, sc, score >= 80 ? "Good" : score >= 60 ? "Fair" : "At risk");
  const hd = document.getElementById("hdelta");
  hd.textContent = "";
  if (prevScore != null) {
    const d = score - prevScore;
    hd.className = "hdelta " + (d > 0 ? "up" : d < 0 ? "down" : "flat");
    hd.textContent = (d > 0 ? "↑ +" : d < 0 ? "↓ " : "· ") + d +
      " vs " + rangeOf().prevLabel;
  } else { hd.className = "hdelta flat"; hd.textContent = "no comparison window"; }
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render() {
  renderFilterbar();
  const days = rangeOf().days(), prevDays = rangeOf().prev();
  const cBase = CALLS.filter(r => cMatch(r));
  const c = inRange(cBase, days);
  const cPrevRaw = prevDays ? inRange(cBase, prevDays) : null;
  const cPrev = hasPrev(cPrevRaw) ? cPrevRaw : null;
  const cAg = inRange(CALLS.filter(r => cMatch(r, { agentToo: true })), days);
  const tDays = trendWindow();
  const C1 = css("--c1"), C2 = css("--c2"), C3 = css("--c3"), C4 = css("--c4"),
        C5 = css("--c5"), C6 = css("--c6");

  const agInRange = AGDAYS.filter(r => days == null || days.includes(r.d));
  const alerts = buildAlerts(c, agInRange);
  const score = healthScore(c, alerts);
  const prevScore = cPrev ? healthScore(cPrev,
    buildAlerts(cPrev).filter(x => !x.title.includes("feed"))) : null;
  renderGauge(score, prevScore);

  const app = document.getElementById("app");
  app.textContent = "";
  const cnt = (arr, f) => arr.filter(f).length;

  /* slice stats used all over */
  const inb = c.filter(isIn), outb = c.filter(isOut);
  const answered = inb.filter(isAnswered);
  const abandoned = inb.filter(r => r.ab);
  const asa = median(answered.map(r => r.qw).filter(v => v != null));
  const slP = pctN(inb.filter(inSL).length, inb.length);
  const talkAvg = (() => { const v = c.filter(r => (r.tt || 0) > 0).map(r => r.tt);
    return v.length ? sum(v) / v.length : null; })();
  const pInb = cPrev ? cPrev.filter(isIn) : null;

  /* ---------- KPI strip ---------- */
  const kwrap = h("div", "kpis", app); kwrap.id = "sec-overview";
  const kpi = (label, iconName, color, value, deltaTxt, deltaDir, sparkVals, bars) => {
    const t = h("div", "kpi", kwrap);
    const top = h("div", "top", t);
    const ic = h("div", "ico", top);
    ic.style.background = color + "22"; ic.appendChild(icon(iconName, color, 14));
    h("div", "lbl", top, label);
    infoIcon(top, label);
    h("div", "v num", t, value);
    const d = h("div", "d", t);
    if (deltaTxt) { d.className = "d " + deltaDir; d.textContent = deltaTxt; }
    if (sparkVals) { const sp = h("div", "spark", t);
      sparkline(sp, sparkVals, color, { bars }); }
  };
  const dNum = (cur, prev, upGood) => {
    const pd = pctDelta(cur, prev);
    if (pd == null || pd === 0) return [null, "flat"];
    return [`${pd > 0 ? "▲" : "▼"} ${Math.abs(pd)}% vs ${rangeOf().prevLabel}`,
      upGood == null ? "flat" : (pd > 0) === upGood ? "up" : "down"];
  };
  const dPts = (cur, prev, upGood) => {
    if (cur == null || prev == null || cur === prev) return [null, "flat"];
    const d = cur - prev;
    return [`${d > 0 ? "▲" : "▼"} ${Math.abs(d)} pts vs ${rangeOf().prevLabel}`,
      (d > 0) === upGood ? "up" : "down"];
  };
  const sD = lastDays(THRESHOLDS.trendDays);

  let [dt, dd] = dNum(c.length, cPrev && cPrev.length, null);
  kpi("Total Calls", "phone", C1, fmt(c.length), dt, dd, dailyCounts(cBase, sD));
  [dt, dd] = dNum(inb.length, pInb && pInb.length, null);
  kpi("Inbound Calls", "phoneIn", C2, fmt(inb.length), dt, dd,
    dailyCounts(cBase, sD, isIn));
  [dt, dd] = dNum(outb.length, cPrev && cnt(cPrev, isOut), null);
  kpi("Outbound Calls", "phoneOut", C4, fmt(outb.length), dt, dd,
    dailyCounts(cBase, sD, isOut), true);
  const ansP = pctN(answered.length, inb.length);
  const pAnsP = pInb ? pctN(pInb.filter(isAnswered).length, pInb.length) : null;
  [dt, dd] = dPts(ansP, pAnsP, true);
  kpi("Answered %", "headset", C5, ansP == null ? "—" : ansP + "%", dt, dd,
    sD.map(d => { const dv = inRange(cBase, [d]).filter(isIn);
      return dv.length ? pctN(dv.filter(isAnswered).length, dv.length) : 0; }));
  const abP = pctN(abandoned.length, inb.length);
  const pAbP = pInb ? pctN(pInb.filter(r => r.ab).length, pInb.length) : null;
  [dt, dd] = dPts(abP, pAbP, false);
  kpi("Abandon Rate", "bell", C3, abP == null ? "—" : abP + "%", dt, dd,
    sD.map(d => { const dv = inRange(cBase, [d]).filter(isIn);
      return dv.length ? pctN(dv.filter(r => r.ab).length, dv.length) : 0; }));
  [dt, dd] = dNum(abandoned.length,
    pInb ? pInb.filter(r => r.ab).length : null, false);
  kpi("Abandoned Calls", "x", C3, fmt(abandoned.length), dt, dd,
    dailyCounts(cBase, sD, r => isIn(r) && r.ab), true);
  const pAsa = pInb ? median(pInb.filter(isAnswered).map(r => r.qw)
    .filter(v => v != null)) : null;
  [dt, dd] = dNum(asa == null ? null : Math.round(asa),
    pAsa == null ? null : Math.round(pAsa), false);
  kpi("Median Speed of Answer", "bolt", C2, fmtSec(asa), dt, dd,
    sD.map(d => { const v = inRange(cBase, [d]).filter(isAnswered)
      .map(r => r.qw).filter(x => x != null);
      return v.length ? Math.round(median(v)) : 0; }));
  const pSlP = pInb ? pctN(pInb.filter(inSL).length, pInb.length) : null;
  [dt, dd] = dPts(slP, pSlP, true);
  kpi(`Service Level ≤${THRESHOLDS.slTargetSec}s`, "gaugeI", C5,
    slP == null ? "—" : slP + "%", dt, dd,
    sD.map(d => { const dv = inRange(cBase, [d]).filter(isIn);
      return dv.length ? pctN(dv.filter(inSL).length, dv.length) : 0; }));
  const pTalk = cPrev ? (() => { const v = cPrev.filter(r => (r.tt || 0) > 0)
    .map(r => r.tt); return v.length ? sum(v) / v.length : null; })() : null;
  [dt, dd] = dNum(talkAvg == null ? null : Math.round(talkAvg),
    pTalk == null ? null : Math.round(pTalk), null);
  kpi("Avg Talk Time", "clock", C1, fmtSec(talkAvg), dt, dd,
    sD.map(d => { const v = inRange(cBase, [d]).filter(r => (r.tt || 0) > 0)
      .map(r => r.tt); return v.length ? Math.round(sum(v) / v.length) : 0; }));
  const wrapOf = arr => { const v = arr.map(wrapSec).filter(x => x != null);
    return v.length ? sum(v) / v.length : null; };
  const acwNow = wrapOf(c);
  const acwPrev = cPrev ? wrapOf(cPrev) : null;
  [dt, dd] = dNum(acwNow == null ? null : Math.round(acwNow),
    acwPrev == null ? null : Math.round(acwPrev), false);
  kpi("Avg Wrap (ACW)", "target", C4, fmtSec(acwNow), dt, dd,
    sD.map(d => { const v = wrapOf(inRange(cBase, [d]));
      return v == null ? 0 : Math.round(v); }));

  /* --- KPI row 2: outcomes & operations --- */
  const setsNow = cnt(c, isSet);
  [dt, dd] = dNum(setsNow, cPrev && cnt(cPrev, isSet), true);
  kpi("Appointments Set", "check", C5, fmt(setsNow), dt, dd,
    dailyCounts(cBase, sD, isSet), true);
  /* "human" connects: talk time > 0 and not an answering-machine pickup
     (machines register talk time, which would flood these denominators) */
  const humanConn = arr => arr.filter(r =>
    (r.tt || 0) > 0 && !/answering[_ ]?machine/i.test(r.dp || ""));
  const setRateOf = arr => pctN(arr.filter(isSet).length, humanConn(arr).length);
  const srNow = setRateOf(c);
  [dt, dd] = dPts(srNow, cPrev ? setRateOf(cPrev) : null, true);
  kpi("Set Rate", "star", C4, srNow == null ? "—" : srNow + "%", dt, dd,
    sD.map(d => setRateOf(inRange(cBase, [d])) || 0));
  const isIvrDrop = r => isIn(r) && !r.sk && !r.ag && !((r.tt || 0) > 0);
  const ivrNow = cnt(c, isIvrDrop);
  [dt, dd] = dNum(ivrNow, cPrev && cnt(cPrev, isIvrDrop), false);
  kpi("IVR Drop-offs", "x", C3, fmt(ivrNow), dt, dd,
    dailyCounts(cBase, sD, isIvrDrop));
  const connRateOf = arr => { const o = arr.filter(isOut);
    return pctN(humanConn(o).length, o.length); };
  const crNow = connRateOf(c);
  [dt, dd] = dPts(crNow, cPrev ? connRateOf(cPrev) : null, true);
  kpi("Outbound Connect Rate", "phoneOut", C2,
    crNow == null ? "—" : crNow + "%", dt, dd,
    sD.map(d => connRateOf(inRange(cBase, [d])) || 0));
  const occOf = rows => { const lg = sum(rows.map(r => r.lg || 0));
    return lg ? Math.round(100 * (sum(rows.map(r => r.tk || 0))
      + sum(rows.map(r => r.aw || 0))) / lg) : null; };
  const agPrev = prevDays ? AGDAYS.filter(r => prevDays.includes(r.d)) : null;
  const occNow = occOf(agInRange);
  [dt, dd] = dPts(occNow, agPrev && agPrev.length ? occOf(agPrev) : null, null);
  kpi("Team Occupancy", "gaugeI", C1, occNow == null ? "—" : occNow + "%", dt, dd,
    sD.map(d => occOf(AGDAYS.filter(r => r.d === d)) || 0));
  const activeOf = arr => new Set(arr.filter(r => r.ag).map(r => r.ag)).size;
  const actNow = activeOf(c);
  [dt, dd] = dNum(actNow, cPrev ? activeOf(cPrev) : null, null);
  kpi("Agents on Calls", "users", C2, fmt(actNow), dt, dd,
    sD.map(d => activeOf(inRange(cBase, [d]))), true);
  const longestOf = arr => { const v = arr.filter(isIn).map(r => r.qw)
    .filter(x => x != null); return v.length ? Math.max(...v) : null; };
  const lwNow = longestOf(c);
  [dt, dd] = dNum(lwNow, cPrev ? longestOf(cPrev) : null, false);
  kpi("Longest Wait", "clock", C3, fmtSec(lwNow), dt, dd,
    sD.map(d => longestOf(inRange(cBase, [d])) || 0));

  /* ---------- insights + alerts rail ---------- */
  const mid = h("div", "midgrid", app);
  const midleft = h("div", "midleft", mid);
  const ins = h("div", "insights", midleft);

  const wins = [];
  if (slP != null && slP >= THRESHOLDS.slWarnPct)
    wins.push(`Service level is ${slP}% — at or above the ${THRESHOLDS.slWarnPct}% target.`);
  if (abP != null && abP <= 5 && inb.length >= 20)
    wins.push(`Abandon rate is just ${abP}% — callers are getting through.`);
  if (asa != null && asa <= 30)
    wins.push(`Typical caller reaches an agent in ${fmtSec(asa)}.`);
  const inPd = pInb ? pctDelta(inb.length, pInb.length) : null;
  if (inPd != null && inPd > 10)
    wins.push(`Inbound demand up ${inPd}% vs ${rangeOf().prevLabel} and being absorbed.`);
  if (acwNow != null && acwNow <= 60)
    wins.push(`Wrap discipline is tight — ${fmtSec(acwNow)} average after-call work.`);
  const wcard = h("div", "insight wins", ins);
  const wh = h("div", "ihead", wcard);
  wh.appendChild(icon("trophy", css("--good"), 16)); wh.append("Key Wins");
  infoIcon(wh, "Key Wins");
  const wul = h("ul", null, wcard);
  (wins.length ? wins.slice(0, 3) : ["Quiet so far in this view."])
    .forEach(w => h("li", null, wul, w));

  const warnsCard = h("div", "insight warns", ins);
  const wh2 = h("div", "ihead", warnsCard);
  wh2.appendChild(icon("alert", css("--warn"), 16)); wh2.append("Needs Attention");
  infoIcon(wh2, "Needs Attention");
  const wul2 = h("ul", null, warnsCard);
  const attn = [];
  alerts.filter(x => !x.ack).slice(0, 3)
    .forEach(x => attn.push(`${x.title} (${x.chip}).`));
  (attn.length ? attn.slice(0, 3) : ["Nothing above thresholds right now."])
    .forEach(t => h("li", null, wul2, t));

  const take = h("div", "insight", ins);
  const th3 = h("div", "ihead", take);
  th3.appendChild(icon("star", css("--accent"), 16)); th3.append("Leadership Takeaway");
  infoIcon(th3, "Leadership Takeaway");
  h("p", null, take,
    `${fmt(inb.length)} inbound and ${fmt(outb.length)} outbound calls in this view; ` +
    (ansP != null ? `${ansP}% of inbound answered` : "no inbound yet") +
    (asa != null ? `, typically within ${fmtSec(asa)}.` : "."));
  const worstSkill = (() => {
    const m = new Map();
    for (const r of inb) { const k = r.sk || "(none)";
      if (!m.has(k)) m.set(k, { n: 0, ab: 0 });
      const o = m.get(k); o.n++; if (r.ab) o.ab++; }
    return [...m].filter(([, o]) => o.n >= 15)
      .map(([k, o]) => [k, pctN(o.ab, o.n), o.n])
      .sort((x, y) => y[1] - x[1])[0];
  })();
  if (worstSkill && worstSkill[1] >= THRESHOLDS.abandonWarnPct)
    h("p", null, take, `Focus area: the ${worstSkill[0]} queue — ` +
      `${worstSkill[1]}% of its ${fmt(worstSkill[2])} calls abandoned before reaching an agent.`);

  /* trend charts */
  const charts = h("div", "charts", midleft); charts.id = "sec-trends";
  const chartCard = (id, title, cap, legend, build) => {
    const card = h("div", "card", charts); if (id) card.id = id;
    const ch = h("div", "chead", card);
    h("h2", null, ch, title);
    infoIcon(ch, title);
    if (cap) h("span", "cap", ch, cap);
    const sel = h("select", null, ch);
    ["Daily", "Weekly"].forEach(o => h("option", null, sel, o));
    if (legend && legend.length > 1) {
      const lg = h("div", "legend", card);
      legend.forEach(s => { const k = h("span", "key", lg);
        const sw = h("span", "sw" + (s.dashed ? " dash" : ""), k);
        if (s.dashed) sw.style.color = s.color; else sw.style.background = s.color;
        k.append(s.label); });
    }
    const body = h("div", "cbody", card);
    const draw = () => { body.textContent = ""; build(body, sel.value === "Weekly"); };
    sel.addEventListener("change", draw);
    draw();
  };
  /* 1 — volume in vs out */
  const volIn = dailyCounts(cBase, tDays, isIn);
  const volOut = dailyCounts(cBase, tDays, isOut);
  chartCard(null, "Call Volume Over Time", null,
    [{ label: "Inbound", color: C2 }, { label: "Outbound", color: C4 }],
    (b, wk) => {
      let d1 = tDays, v1 = volIn, v2 = volOut;
      if (wk) { const w1 = weekly(tDays, volIn, "sum");
        d1 = w1.days; v1 = w1.values; v2 = weekly(tDays, volOut, "sum").values; }
      lineArea(b, d1, [
        { label: "Inbound", color: C2, values: v1, area: true },
        { label: "Outbound", color: C4, values: v2, area: true }]);
    });
  /* 2 — speed of answer + SL% (dual axis) */
  const asaDaily = tDays.map(d => { const v = inRange(cBase, [d]).filter(isAnswered)
    .map(r => r.qw).filter(x => x != null);
    return v.length ? Math.round(median(v)) : null; });
  const slDaily = tDays.map(d => { const dv = inRange(cBase, [d]).filter(isIn);
    return dv.length ? pctN(dv.filter(inSL).length, dv.length) : null; });
  chartCard("sec-service", "Speed of Answer & Service Level",
    `median wait · % answered ≤${THRESHOLDS.slTargetSec}s`,
    [{ label: "Median Wait (s)", color: C1 },
     { label: "Service Level %", color: C5, dashed: true }],
    (b, wk) => {
      let d1 = tDays, v1 = asaDaily, v2 = slDaily;
      if (wk) { const w1 = weekly(tDays, asaDaily, "median");
        d1 = w1.days; v1 = w1.values;
        v2 = weekly(tDays, slDaily, "median").values; }
      lineArea(b, d1, [
        { label: "Median wait", color: C1, values: v1, area: true, fmtV: fmtSec },
        { label: "Service level", color: C5, values: v2, dashed: true,
          axis: "y2", fmtV: v => v + "%" }],
        { y2: { fmt: v => v + "%" } });
    });
  /* 3 — abandonment */
  const abDaily = dailyCounts(cBase, tDays, r => isIn(r) && r.ab);
  const abPctDaily = tDays.map((d, i) => {
    const dv = inRange(cBase, [d]).filter(isIn);
    return dv.length ? pctN(abDaily[i], dv.length) : null; });
  chartCard(null, "Abandoned Calls Over Time", "count & % of inbound",
    [{ label: "Abandoned", color: C3 }, { label: "% of Inbound", color: C2, dashed: true }],
    (b, wk) => {
      let d1 = tDays, v1 = abDaily, v2 = abPctDaily;
      if (wk) { const w1 = weekly(tDays, abDaily, "sum");
        d1 = w1.days; v1 = w1.values;
        v2 = weekly(tDays, abPctDaily, "median").values; }
      lineArea(b, d1, [
        { label: "Abandoned", color: C3, values: v1, area: true },
        { label: "% of inbound", color: C2, values: v2, dashed: true,
          axis: "y2", fmtV: v => v + "%" }],
        { y2: { fmt: v => v + "%" } });
    });

  /* alerts & risks rail */
  const acard = h("div", "card alertcard", mid); acard.id = "sec-alerts";
  const ahead = h("div", "chead", acard);
  h("h2", null, ahead, "Alerts & Risks");
  infoIcon(ahead, "Alerts & Risks");
  const liveN = alerts.filter(x => !x.ack).length;
  const ackN = alerts.length - liveN;
  h("span", "cap", ahead, (liveN ? liveN + " active" : "all clear")
    + (ackN ? " · " + ackN + " known" : ""));
  let showAllAlerts = false;
  const va = h("button", "viewall", ahead, alerts.length > 4 ? "View all" : "");
  const abody = h("div", "cbody", acard);
  const drawAlerts = () => {
    abody.textContent = "";
    if (!alerts.length) {
      const row = h("div", "alertrow", abody);
      row.appendChild(icon("shield", css("--good"), 15));
      const tx = h("div", null, row);
      h("div", "t", tx, "No active alerts");
      h("div", "x", tx, "All monitored thresholds are green in this view.");
      h("span", "sevchip ok", row, "OK");
      return;
    }
    (showAllAlerts ? alerts : alerts.slice(0, 5)).forEach(al => {
      const row = h("div", "alertrow", abody);
      row.appendChild(icon(al.title.includes("feed") ? "shield"
        : al.title.includes("Abandon") || al.title.includes("losing") ? "bell"
        : al.title.includes("volume") ? "trend" : "clock",
        al.ack ? css("--muted") : al.sev === "crit" ? css("--crit") : css("--warn"), 15));
      const tx = h("div", null, row);
      h("div", "t", tx, al.title);
      h("div", "x", tx, al.detail + " (" + al.chip + ")"
        + (al.ack ? " — " + al.ack : ""));
      h("span", "sevchip " + (al.ack ? "ok" : al.sev === "crit" ? "hi" : "md"),
        row, al.ack ? "Known" : al.sev === "crit" ? "High" : "Medium");
    });
  };
  va.addEventListener("click", () => { showAllAlerts = !showAllAlerts;
    va.textContent = showAllAlerts ? "Collapse" : "View all"; drawAlerts(); });
  drawAlerts();

  /* ---------- hourly pattern + wait distribution ---------- */
  const hgrid = h("div", "hourgrid", app);
  const hcard = h("div", "card", hgrid); hcard.id = "sec-hourly";
  const hh1 = h("div", "chead", hcard);
  h("h2", null, hh1, "Hourly Call Pattern");
  infoIcon(hh1, "Hourly Call Pattern");
  const activeDays = new Set(c.map(r => etDay(r.d))).size || 1;
  h("span", "cap", hh1, `avg per day · ${activeDays} day${activeDays > 1 ? "s" : ""} in view`);
  const hb = h("div", "cbody", hcard);
  const hourAvg = f => { const v = new Array(24).fill(0);
    for (const r of c) if (f(r)) v[+r.d.slice(11, 13)]++;
    return v.map(x => Math.round(10 * x / activeDays) / 10); };
  const miniLegend = (parent, items) => {
    const lg = h("div", "legend", parent);
    lg.style.padding = "0 0 2px";
    items.forEach(([l, col]) => { const k = h("span", "key", lg);
      h("span", "sw", k).style.background = col; k.append(l); });
  };
  /* Split by direction: the auto-dialer runs ~20x inbound volume, so sharing
     one axis flattened inbound into a stub. Separate scales also give each
     bar the full hour slot, so every value label fits. */
  h("div", "micro", hb, "Inbound & abandoned");
  miniLegend(hb, [["Inbound", C2], ["Abandoned", C3]]);
  hourBars(hb, [
    { label: "Inbound", color: C2, values: hourAvg(isIn) },
    { label: "Abandoned", color: C3, values: hourAvg(r => isIn(r) && r.ab) },
  ], { labels: true, height: 165 });
  h("div", "micro", hb, "Outbound");
  miniLegend(hb, [["Outbound", C4]]);
  hourBars(hb, [
    { label: "Outbound", color: C4, values: hourAvg(isOut) },
  ], { labels: true, height: 150 });
  /* open-hours split */
  const inbBiz = inb.filter(inBizHours);
  const inbAfter = inb.filter(r => !inBizHours(r));
  h("div", "micro", hb, "Open hours vs after hours · inbound");
  [["Open hours", inbBiz, C5], ["After hours", inbAfter, C6]].forEach(([label, set, col]) => {
    const row = h("div", "formrow", hb);
    h("span", "fl", row, label);
    h("span", "cnt num", row, fmt(set.length));
    const track = h("div", "track", row);
    const bar = h("div", "bar", track);
    bar.style.width = Math.max(pctN(set.length, inb.length) || 0, 2) + "%";
    bar.style.background = col;
    h("span", "pctv num", row, pct(set.length, inb.length));
  });

  /* dispositions donut (paired with the hourly chart) */
  const dcard = h("div", "card", hgrid);
  const dh = h("div", "chead", dcard);
  h("h2", null, dh, "Dispositions");
  infoIcon(dh, "Dispositions");
  if (DEPT_SEL) h("span", "scopechip", dh, DEPT_SEL.size === 1
    ? [...DEPT_SEL][0] : DEPT_SEL.size + " depts");
  if (AG_SEL) h("span", "scopechip", dh, AG_SEL.size === 1
    ? "agent: " + [...AG_SEL][0] : AG_SEL.size + " agents selected");
  const db = h("div", "cbody", dcard);
  const dSlice = (AG_SEL || DEPT_SEL) ? cAg : c;
  const dispC = [...counter(dSlice, r => r.dp || "(none)")]
    .sort((x, y) => y[1] - x[1]);
  if (!dispC.length) h("div", "empty", db, "No calls in view");
  else {
    const DC = [C1, C2, C3, C4, C5];
    const top = dispC.slice(0, 5).map(([l, v], i) =>
      ({ label: l, value: v, color: DC[i] }));
    const rest = sum(dispC.slice(5).map(([, v]) => v));
    if (rest) top.push({ label: "Other", value: rest, color: C6 });
    const totalN = sum(dispC.map(([, v]) => v));
    donut(db, top, fmt(totalN), "Total Calls", { legend: false });
    /* full breakdown below the donut — complete labels + numbers */
    const maxN = dispC[0][1];
    const listBox = h("div", null, db);
    let showAllD = false;
    const drawDispList = () => {
      listBox.textContent = "";
      (showAllD ? dispC : dispC.slice(0, 9)).forEach(([label, n], i) => {
        const row = h("div", "formrow wide", listBox);
        row.title = `${label} — ${fmt(n)} (${pct(n, totalN)})`;
        const color = i < 5 ? DC[i] : C6;
        const fl = h("span", "fl", row);
        const dot = h("span", "srcdot", fl); dot.style.background = color;
        fl.append(label);
        h("span", "cnt num", row, fmt(n));
        const track = h("div", "track", row);
        const bar = h("div", "bar", track);
        bar.style.width = Math.max(Math.round(100 * n / maxN), 2) + "%";
        bar.style.background = color;
        h("span", "pctv num", row, pct(n, totalN));
      });
    };
    drawDispList();
    if (dispC.length > 9) {
      const dfoot = h("div", "cfoot", dcard);
      const dfa = h("a", null, dfoot, `View all ${dispC.length} dispositions →`);
      dfa.addEventListener("click", () => {
        showAllD = !showAllD;
        dfa.textContent = showAllD ? "Collapse ↑"
          : `View all ${dispC.length} dispositions →`;
        drawDispList();
      });
    }
  }

  /* ---------- bottom row: campaigns · dispositions · skills ---------- */
  const bot = h("div", "botgrid", app);

  /* campaign performance */
  const pcard = h("div", "card", bot); pcard.id = "sec-camp";
  const ph = h("div", "chead", pcard);
  h("h2", null, ph, "Campaign Performance");
  infoIcon(ph, "Campaign Performance");
  const pb = h("div", "cbody", pcard);
  const byCamp = new Map();
  for (const r of c) { const k = r.cp || "(none)";
    if (!byCamp.has(k)) byCamp.set(k, []);
    byCamp.get(k).push(r); }
  const campRows = [...byCamp].sort((x, y) => y[1].length - x[1].length);
  if (!campRows.length) h("div", "empty", pb, "No campaigns in view");
  else {
    const tbl = h("table", "perf", pb);
    const thr = h("tr", null, h("thead", null, tbl));
    ["Campaign", "Calls", "Answered", "Abandon", "Avg Talk",
     "Trend (" + (FILT.range === "all" ? (D.days_kept || 30) : THRESHOLDS.trendDays) + "d)"]
      .forEach(cc => h("th", null, thr, cc));
    const tbody = h("tbody", null, tbl);
    const CC = [C1, C2, C3, C4, C5, C6];
    campRows.slice(0, 8).forEach(([name, rows], i) => {
      const rIn = rows.filter(isIn);
      const tr = h("tr", null, tbody);
      const td0 = h("td", null, tr);
